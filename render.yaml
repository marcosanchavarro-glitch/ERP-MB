# DEMO only: Render Free web + independent Neon Free PostgreSQL.
services:
  - type: web
    name: erp-mb-demo
    runtime: node
    branch: codex/render-demo
    region: oregon
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:render
    healthCheckPath: /health/ready
    autoDeployTrigger: 'off' # Enable commit after granting Render access to ERP-MB in GitHub.
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: demo
      - key: HOST
        value: 0.0.0.0
      - key: APP_NAME
        value: ERP Demo
      - key: ORGANIZATION_NAME
        value: Manantial de Bendiciones
      - key: TRUST_PROXY
        value: loopback,linklocal,uniquelocal
      - key: SESSION_SECRET
        sync: false
      - key: RUNTIME_DB_PASSWORD
        sync: false
      - key: DEMO_BOOTSTRAP_SECRET
        sync: false
      - key: ALLOW_DEMO_SEED
        value: "true"
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
